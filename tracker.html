<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Competency Tracker — HITH &amp; District Nursing · SVHM</title>
<style>
:root{
  --navy:#1B3A6B;--navy-l:#254e8f;--teal:#00838a;
  --bg:#f0f4f8;--card:#fff;--bdr:#e2e8f0;--txt:#1e293b;--muted:#64748b;
  --ok:#16a34a;--ok-bg:#dcfce7;--ok-bdr:#86efac;
  --warn:#b45309;--warn-bg:#fef3c7;--warn-bdr:#fcd34d;
  --err:#dc2626;--err-bg:#fee2e2;--err-bdr:#fca5a5;
  --gray:#94a3b8;--gray-bg:#f1f5f9;--r:8px;
  --sh:0 1px 3px rgba(0,0,0,.1);--sh2:0 12px 32px rgba(0,0,0,.18);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f172a;--card:#1e293b;--bdr:#334155;--txt:#f1f5f9;--muted:#94a3b8;--gray-bg:#1e293b;
}}
:root[data-theme=dark]{--bg:#0f172a;--card:#1e293b;--bdr:#334155;--txt:#f1f5f9;--muted:#94a3b8;--gray-bg:#1e293b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
.hdr{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.hdr-brand{display:flex;align-items:center;gap:10px;}
.hdr-title{font-size:14px;font-weight:700;line-height:1.2;}
.hdr-sub{font-size:10px;opacity:.6;}
.hdr-right{display:flex;gap:6px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;line-height:1;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--teal);color:#fff;}.btn-primary:hover:not(:disabled){background:#006870;}
.btn-navy{background:var(--navy);color:#fff;}.btn-navy:hover:not(:disabled){background:var(--navy-l);}
.btn-danger{background:var(--err);color:#fff;}.btn-danger:hover:not(:disabled){background:#b91c1c;}
.btn-outline{background:transparent;color:var(--txt);border:1.5px solid var(--bdr);}.btn-outline:hover:not(:disabled){background:var(--gray-bg);}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);}.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.12);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}
.land{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(150deg,#162d55 0%,#1a5276 100%);color:#fff;padding:32px;text-align:center;}
.land h1{font-size:26px;font-weight:800;margin-bottom:6px;}
.lsub{font-size:14px;opacity:.7;margin-bottom:44px;}
.lcards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.lcard{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:30px 28px;min-width:200px;max-width:220px;cursor:pointer;transition:.2s;backdrop-filter:blur(8px);}
.lcard:hover{background:rgba(255,255,255,.2);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.2);}
.lcard .icon{font-size:42px;margin-bottom:12px;}
.lcard h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.lcard p{font-size:12px;opacity:.7;line-height:1.4;}
.lfooter{margin-top:36px;font-size:11px;opacity:.35;}
.lgn-bg{min-height:100vh;background:linear-gradient(150deg,#162d55 0%,#1a5276 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.lgn{background:var(--card);border-radius:16px;padding:36px;width:100%;max-width:380px;box-shadow:var(--sh2);}
.lgn h2{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.lgn .desc{color:var(--muted);font-size:13px;margin-bottom:22px;line-height:1.4;}
.fg{margin-bottom:15px;}
.fg label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:2px solid var(--bdr);border-radius:var(--r);font-size:14px;background:var(--card);color:var(--txt);outline:none;transition:.15s;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--teal);}
.pin-inp{font-size:28px!important;letter-spacing:12px!important;text-align:center!important;font-weight:800!important;font-family:monospace!important;}
.errmsg{color:var(--err);font-size:12px;margin-top:5px;display:none;}
.errmsg.show{display:block;}
.back-lnk{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;}
.back-lnk:hover{color:var(--txt);}
.adm{display:flex;flex-direction:column;min-height:100vh;}
.adm-body{flex:1;padding:20px;max-width:1280px;margin:0 auto;width:100%;}
.tabs{display:flex;gap:3px;margin-bottom:18px;background:var(--card);border-radius:var(--r);padding:4px;box-shadow:var(--sh);width:fit-content;flex-wrap:wrap;}
.tab{padding:7px 15px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--muted);transition:.15s;}
.tab:hover{color:var(--txt);}
.tab.act{background:var(--navy);color:#fff;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:18px;}
.sc{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-left:4px solid var(--teal);}
.sc.ok{border-color:var(--ok);}.sc.warn{border-color:#d97706;}.sc.bad{border-color:var(--err);}
.sc .sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px;}
.sc .sv{font-size:28px;font-weight:800;color:var(--navy);line-height:1.1;}
.sc .ss{font-size:11px;color:var(--muted);margin-top:2px;}
.pbar{height:6px;background:var(--bdr);border-radius:3px;overflow:hidden;margin-top:7px;}
.pfill{height:100%;border-radius:3px;}
.pfill.g{background:var(--ok);}.pfill.m{background:#d97706;}.pfill.r{background:var(--err);}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px;}
.ov-card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);}
.ov-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:14px;}
.ov-row{margin-bottom:10px;}.ov-row:last-child{margin-bottom:0;}
.ov-row-top{display:flex;justify-content:space-between;margin-bottom:3px;}
.ov-lbl{font-size:11px;color:var(--muted);}.ov-pct{font-size:11px;font-weight:700;}
.tbl-wrap{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--bdr);gap:10px;flex-wrap:wrap;}
.tbl-hdr-title{font-size:13px;font-weight:700;color:var(--navy);}
.tbl-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{background:var(--navy);color:#fff;padding:9px 13px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
td{padding:10px 13px;border-bottom:1px solid var(--bdr);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.rc{cursor:pointer;}
tr.rc:hover td{background:rgba(0,131,138,.05);}
.toolbar{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap;align-items:center;}
.srch{flex:1;min-width:180px;padding:8px 11px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:13px;background:var(--card);color:var(--txt);outline:none;}
.srch:focus{border-color:var(--teal);}
.fsel{padding:8px 10px;border:1.5px solid var(--bdr);border-radius:var(--r);font-size:13px;background:var(--card);color:var(--txt);outline:none;cursor:pointer;}
.fsel:focus{border-color:var(--teal);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.b-ok{background:var(--ok-bg);color:#166534;border:1px solid var(--ok-bdr);}
.b-ip{background:var(--warn-bg);color:#92400e;border:1px solid var(--warn-bdr);}
.b-nc{background:var(--err-bg);color:#991b1b;border:1px solid var(--err-bdr);}
.b-nr{background:var(--gray-bg);color:var(--muted);border:1px solid var(--bdr);}
.b-pin{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd;}
.b-nopin{background:var(--gray-bg);color:var(--muted);border:1px solid var(--bdr);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(4px);}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);}
.modal.sm{max-width:420px;}
.modal.xs{max-width:340px;}
.mhdr{padding:20px 24px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--card);z-index:1;}
.mtitle{font-size:16px;font-weight:800;color:var(--navy);}
.msub{font-size:12px;color:var(--muted);margin-top:2px;}
.mclose{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:3px 6px;border-radius:4px;}
.mclose:hover{background:var(--gray-bg);}
.mbody{padding:20px 24px;}
.mfoot{padding:13px 24px 20px;border-top:1px solid var(--bdr);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;}
.mfoot-l{flex:1;}
.pin-box{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 18px;text-align:center;margin:10px 0;}
.pin-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:4px;}
.pin-num{font-size:32px;font-weight:800;letter-spacing:10px;font-family:monospace;}
.pin-acts{display:flex;gap:7px;justify-content:center;margin-top:9px;}
.csec{margin-bottom:20px;}
.chead{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;margin-bottom:9px;border-bottom:2px solid var(--bdr);}
.ctitle{font-size:13px;font-weight:800;color:var(--navy);}
.citems{display:flex;flex-direction:column;gap:6px;}
.citem{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--gray-bg);border-radius:7px;gap:8px;flex-wrap:wrap;}
.citem-lbl{font-size:12px;font-weight:600;flex:1;min-width:130px;}
.citem-r{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.esel{padding:4px 7px;border:1.5px solid var(--bdr);border-radius:5px;font-size:11px;background:var(--card);color:var(--txt);outline:none;}
.esel:focus{border-color:var(--teal);}
.edate{padding:4px 7px;border:1.5px solid var(--bdr);border-radius:5px;font-size:11px;background:var(--card);color:var(--txt);outline:none;}
.edate:focus{border-color:var(--teal);}
.comp-cat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden;}
.comp-cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bdr);background:var(--gray-bg);gap:10px;flex-wrap:wrap;}
.comp-cat-name{font-size:14px;font-weight:800;color:var(--navy);}
.comp-comps{padding:12px 18px;}
.comp-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--gray-bg);border-radius:6px;margin-bottom:6px;gap:8px;}
.comp-row:last-child{margin-bottom:0;}
.comp-row-name{font-size:12px;font-weight:600;}
.comp-row-acts{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.uview{max-width:580px;margin:0 auto;padding:20px 14px;}
.uhdr{background:var(--navy);color:#fff;border-radius:14px;padding:20px;margin-bottom:18px;}
.uname{font-size:19px;font-weight:800;margin-bottom:3px;}
.umeta{font-size:12px;opacity:.65;}
.u-chips{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;}
.ucard{background:var(--card);border-radius:12px;padding:16px;margin-bottom:13px;box-shadow:var(--sh);}
.uchead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:8px;}
.uctitle{font-size:13px;font-weight:800;color:var(--navy);}
.urow{display:flex;align-items:flex-start;justify-content:space-between;padding:8px 10px;background:var(--gray-bg);border-radius:7px;margin-bottom:5px;gap:10px;}
.urow:last-child{margin-bottom:0;}
.urow-lbl{font-size:12px;font-weight:500;flex:1;}
.setting-box{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px;}
.setting-title{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:4px;}
.setting-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.ibox{border-radius:var(--r);padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:13px;}
.ibox strong{display:block;margin-bottom:2px;}
.ibox-info{background:#e0f2fe;border-left:4px solid #0284c7;color:#0c4a6e;}
.ibox-warn{background:var(--warn-bg);border-left:4px solid #d97706;color:#78350f;}
.ibox-ok{background:var(--ok-bg);border-left:4px solid var(--ok);color:#14532d;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:999;box-shadow:var(--sh2);animation:slin .2s ease;max-width:320px;}
@keyframes slin{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.spin{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;}
.spin.dk{border-color:var(--bdr);border-top-color:var(--navy);}
@keyframes rot{to{transform:rotate(360deg);}}
.ldscr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.ldscr p{color:var(--muted);font-size:14px;}
.sechd{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:11px;margin-top:18px;}
.sechd:first-child{margin-top:0;}
.divider{height:1px;background:var(--bdr);margin:16px 0;}
.txt-muted{color:var(--muted);}
.chip-cc{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#dbeafe;color:#1e40af;}
code{background:var(--gray-bg);padding:2px 6px;border-radius:4px;font-size:12px;}
.storage-warn{background:#fef3c7;border:1px solid #fcd34d;border-radius:var(--r);padding:8px 12px;font-size:11px;color:#78350f;margin-bottom:12px;display:none;}
.storage-warn.show{display:block;}
@media(max-width:600px){
  .adm-body{padding:12px;}
  .lcards{flex-direction:column;align-items:center;}
  .lcard{max-width:100%;}
  .tabs{width:100%;}.tab{flex:1;text-align:center;padding:7px 6px;font-size:12px;}
  th,td{padding:8px 9px;}
  .mbody,.mhdr,.mfoot{padding-left:14px;padding-right:14px;}
  .stats{grid-template-columns:1fr 1fr;}
}
</style>

  }

function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item'; }
function uniqueSlug(base,existing){ var s=slugify(base),n=2; while(existing.includes(s)) s=slugify(base)+'-'+n++; return s; }
function genPin(){
  var used=APP.data.staff.map(function(s){return s.pin;}).filter(Boolean), p, t=0;
  do{ p=String(Math.floor(100000+Math.random()*900000)); t++; }while(used.includes(p)&&t<60);
  return p;
}
function fmtDate(v){
  if(!v) return '';
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var d=new Date(v); if(isNaN(d)) return v;
  return String(d.getDate()).padStart(2,'0')+'-'+mo[d.getMonth()]+'-'+d.getFullYear();
}
function toComp(dateStr){ return dateStr?'Completed - '+fmtDate(dateStr):'Completed - (date not recorded)'; }
function parseType(s){
  if(!s||s==='No record') return 'nr';
  if(s.startsWith('Completed')) return 'done';
  if(s==='In Progress') return 'ip';
  return 'nc';
}
function parseDateVal(s){
  if(!s||!s.startsWith('Completed - ')) return '';
  var rest=s.slice(12), m=rest.match(/^(\d{2})-([A-Za-z]{3})-(\d{4})$/);
  if(!m) return '';
  var mo={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  return m[3]+'-'+(mo[m[2]]||'01')+'-'+m[1];
}
var isCmp=function(s){ return typeof s==='string'&&s.startsWith('Completed'); };
function compIsDone(staff,catId){
  var cat=APP.data.comps.find(function(c){return c.id===catId;}); if(!cat) return false;
  var sc=(staff.comps&&staff.comps[catId])||{};
  return cat.components.every(function(comp){return isCmp(sc[comp.id]);});
}
function pct(n,d){ return d?Math.round(n/d*100):0; }
function pfClass(p){ return p>=75?'g':p>=40?'m':'r'; }
function scClass(p){ return p>=75?'ok':p>=40?'warn':'bad'; }

function statusBadge(s){
  var t=parseType(s);
  if(t==='done') return '<span class="badge b-ok">\u2713 '+(s.startsWith('Completed - ')?s.slice(12):'Completed')+'</span>';
  if(t==='ip')   return '<span class="badge b-ip">\u27f3 In Progress</span>';
  if(t==='nc')   return '<span class="badge b-nc">\u2717 Not Completed</span>';
  return '<span class="badge b-nr">\u2014 No record</span>';
}
function overallBadge(done){
  return done?'<span class="badge b-ok">\u2713 Completed</span>':'<span class="badge b-nc">Incomplete</span>';
}
function toast(msg,dur){
  dur=dur||3200;
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){t.remove();},dur);
}
function el(id){ return document.getElementById(id); }
function set(id,html){ var e=el(id); if(e) e.innerHTML=html; }

var _dlgResolve = null;

function dlgPrompt(title, defaultVal) {
  return new Promise(function(resolve) {
    _dlgResolve = resolve;
    var ov = document.createElement('div');
    ov.className='overlay'; ov.id='_dlg';
    ov.innerHTML='<div class="modal xs">'+
      '<div class="mhdr" style="padding:16px 20px 14px"><div class="mtitle">'+title+'</div></div>'+
      '<div class="mbody" style="padding:16px 20px">'+
      '<div class="fg" style="margin-bottom:0"><input id="_dlg-inp" value="'+(defaultVal||'')+'" style="font-size:14px"></div>'+
      '</div>'+
      '<div class="mfoot" style="padding:10px 20px 16px">'+
      '<button class="btn btn-outline btn-sm" onclick="_dlgCancel()">Cancel</button>'+
      '<button class="btn btn-primary btn-sm" onclick="_dlgOk()">OK</button>'+
      '</div></div>';
    document.body.appendChild(ov);
    setTimeout(function(){ var i=el('_dlg-inp'); if(i){i.focus();i.select();}},50);
    el('_dlg-inp').addEventListener('keydown',function(e){
      if(e.key==='Enter') _dlgOk();
      if(e.key==='Escape') _dlgCancel();
    });
  });
}
function _dlgOk(){ var v=el('_dlg-inp'); var r=_dlgResolve; _dlgResolve=null; el('_dlg').remove(); if(r) r(v?v.value:''); }
function _dlgCancel(){ var r=_dlgResolve; _dlgResolve=null; el('_dlg').remove(); if(r) r(null); }

function dlgConfirm(msg) {
  return new Promise(function(resolve) {
    _dlgResolve = resolve;
    var ov = document.createElement('div');
    ov.className='overlay'; ov.id='_dlg';
    ov.innerHTML='<div class="modal xs">'+
      '<div class="mbody" style="padding:24px 22px 8px">'+
      '<p style="font-size:14px;line-height:1.5;color:var(--txt)">'+msg+'</p>'+
      '</div>'+
      '<div class="mfoot" style="padding:12px 22px 20px">'+
      '<button class="btn btn-outline btn-sm" onclick="_dlgNo()">Cancel</button>'+
      '<button class="btn btn-danger btn-sm" onclick="_dlgYes()">Confirm</button>'+
      '</div></div>';
    document.body.appendChild(ov);
  });
}
function _dlgYes(){ var r=_dlgResolve; _dlgResolve=null; el('_dlg').remove(); if(r) r(true); }
function _dlgNo(){  var r=_dlgResolve; _dlgResolve=null; el('_dlg').remove(); if(r) r(false); }

async function doAdminLogin(){
  var pw=el('adm-pw').value, err=el('adm-err');
  err.classList.remove('show'); if(!pw) return;
  var hash=await sha256(pw);
  if(hash===APP.data.adminHash){
    APP.session={role:'admin'}; setSession(APP.session); showAdmin();
  } else { err.classList.add('show'); }
}
function doUserLogin(){
  var pin=el('usr-pin').value, err=el('pin-err');
  err.classList.remove('show'); if(pin.length!==6) return;
  var staff=APP.data.staff.find(function(s){return s.pin===pin;});
  if(staff){ APP.session={role:'staff',staffId:staff.id}; setSession(APP.session); showUser(); }
  else { err.classList.add('show'); }
}
function signOut(){ clearSession(); APP.session=null; showLanding(); }

function switchTab(t){
  ATAB=t;
  var map={overview:'ov',staff:'st',comps:'cm',settings:'sx'};
  Object.keys(map).forEach(function(k){ var e=el('tab-'+map[k]); if(e) e.classList.toggle('act',k===t); });
  if(t==='overview') renderOverview();
  else if(t==='staff') renderStaff();
  else if(t==='comps') renderComps();
  else renderSettings();
}

// ═══════════════════════════════════════════════════════════════
//  OVERVIEW TAB
// ═══════════════════════════════════════════════════════════════
function renderOverview(){
  var D=APP.data, n=D.staff.length;
  var pinN=D.staff.filter(function(s){return s.pin;}).length;
  var centres=[...new Set(D.staff.map(function(s){return s.costCentre;}))].sort();
  function catDone(catId){ return D.staff.filter(function(s){return compIsDone(s,catId);}).length; }

  var statCards=D.comps.map(function(cat){
    var done=catDone(cat.id),p=pct(done,n),lbl=cat.name.split('\u2014')[0].trim();
    return '<div class="sc '+scClass(p)+'"><div class="sl">'+lbl+'</div><div class="sv">'+done+'</div>'+
      '<div class="ss">'+p+'% of all staff completed</div>'+
      '<div class="pbar"><div class="pfill '+pfClass(p)+'" style="width:'+p+'%"></div></div></div>';
  }).join('');

  var ccTH=D.comps.map(function(c){return '<th style="text-align:center">'+c.name.split('\u2014')[0].trim()+'</th>';}).join('');
  var ccRows=centres.map(function(cc){
    var sub=D.staff.filter(function(s){return s.costCentre===cc;}),sn=sub.length;
    var cells=D.comps.map(function(cat){
      var p=pct(sub.filter(function(s){return compIsDone(s,cat.id);}).length,sn);
      return '<td style="text-align:center"><span class="badge '+(p===100?'b-ok':p>0?'b-ip':'b-nr')+'">'+p+'%</span></td>';
    }).join('');
    return '<tr><td><strong>'+cc+'</strong><br><small class="txt-muted">'+sn+' staff</small></td>'+cells+'</tr>';
  }).join('');

  var subCards=D.comps.map(function(cat){
    var rows=cat.components.map(function(comp){
      var done=D.staff.filter(function(s){return isCmp((s.comps[cat.id]||{})[comp.id]);}).length;
      var p=pct(done,n);
      return '<div class="ov-row"><div class="ov-row-top"><span class="ov-lbl">'+comp.name+'</span><span class="ov-pct">'+done+'/'+n+' ('+p+'%)</span></div>'+
        '<div class="pbar"><div class="pfill '+pfClass(p)+'" style="width:'+p+'%"></div></div></div>';
    }).join('');
    return '<div class="ov-card"><div class="ov-title">'+cat.name+'</div>'+rows+'</div>';
  }).join('');

  set('tab-body',
    '<div class="stats"><div class="sc"><div class="sl">Total Staff</div><div class="sv">'+n+'</div><div class="ss">'+pinN+' PINs issued &middot; '+centres.length+' cost centres</div></div>'+statCards+'</div>'+
    '<div class="ov-grid">'+subCards+'</div>'+
    '<div class="tbl-wrap"><div class="tbl-hdr"><span class="tbl-hdr-title">Completion by Cost Centre</span></div>'+
    '<div class="tbl-scroll"><table><thead><tr><th>Cost Centre</th>'+ccTH+'</tr></thead><tbody>'+ccRows+'</tbody></table></div></div>'
  );
}

// ═══════════════════════════════════════════════════════════════
//  STAFF TAB
// ═══════════════════════════════════════════════════════════════
function renderStaff(){
  var D=APP.data;
  var centres=[...new Set(D.staff.map(function(s){return s.costCentre;}))].sort();
  var filtered=D.staff.filter(function(s){
    var q=AFLTR.q.toLowerCase();
    if(q&&!s.name.toLowerCase().includes(q)&&!s.id.includes(q)) return false;
    if(AFLTR.cc&&s.costCentre!==AFLTR.cc) return false;
    return true;
  }).sort(function(a,b){return a.name.localeCompare(b.name);});

  var ccOpts=centres.map(function(c){return '<option value="'+c+'"'+(AFLTR.cc===c?' selected':'')+'>'+c+'</option>';}).join('');
  var compTH=D.comps.map(function(c){return '<th style="text-align:center">'+c.name.split('\u2014')[0].trim()+'</th>';}).join('');
  var rows=filtered.map(function(s){
    var cells=D.comps.map(function(cat){
      var done=compIsDone(s,cat.id);
      return '<td style="text-align:center"><span class="badge '+(done?'b-ok':'b-nc')+'">'+(done?'\u2713':'\u2717')+'</span></td>';
    }).join('');
    var pb=s.pin?'<span class="badge b-pin">\uD83D\uDCCC '+s.pin+'</span>':'<span class="badge b-nopin">No PIN</span>';
    return '<tr class="rc" data-id="'+s.id+'"><td><strong>'+s.name+'</strong><br><small class="txt-muted">'+s.id+'</small></td>'+
      '<td><span class="chip-cc">'+s.costCentre+'</span></td>'+cells+'<td>'+pb+'</td></tr>';
  }).join('')||'<tr><td colspan="20" style="text-align:center;padding:32px;color:var(--muted)">No staff match your filters.</td></tr>';

  set('tab-body',
    '<div class="toolbar">'+
    '<input type="search" class="srch" id="st-srch" placeholder="Search name or worker ID\u2026" value="'+AFLTR.q+'">'+
    '<select class="fsel" id="st-cc"><option value="">All Cost Centres</option>'+ccOpts+'</select>'+
    '<button class="btn btn-primary" id="btn-add-staff">+ Add Staff Member</button>'+
    '</div>'+
    '<div class="tbl-wrap"><div class="tbl-scroll"><table>'+
    '<thead><tr><th>Name / ID</th><th>Cost Centre</th>'+compTH+'<th>PIN</th></tr></thead>'+
    '<tbody id="staff-tbody">'+rows+'</tbody></table></div></div>'+
    '<p style="font-size:11px;color:var(--muted);margin-top:7px">Showing '+filtered.length+' of '+D.staff.length+' staff &middot; click a row to manage</p>'
  );
  el('st-srch').addEventListener('input',function(){ AFLTR.q=this.value; renderStaff(); });
  el('st-cc').addEventListener('change',function(){ AFLTR.cc=this.value; renderStaff(); });
  el('btn-add-staff').addEventListener('click', openAddStaff);
  document.querySelectorAll('#staff-tbody tr.rc').forEach(function(tr){
    tr.addEventListener('click',function(){ openStaffModal(this.dataset.id); });
  });
}

var EBUF=null;
function closeModal(){ var m=el('_modal'); if(m) m.remove(); EBUF=null; }

function openStaffModal(id){
  var s=APP.data.staff.find(function(x){return x.id===id;}); if(!s) return;
  EBUF=JSON.parse(JSON.stringify(s));
  renderStaffModal();
}

  var centres=[...new Set(D.staff.map(function(x){return x.costCentre;}))].sort();

    var dHide=t!=='done'?' style="display:none"':'';
    return '<select class="esel" data-cat="'+catId+'" data-comp="'+compId+'">'+

  var compSecs=D.comps.map(function(cat){

      '<button class="btn btn-danger btn-sm" id="btn-prev">\u2715 Revoke</button></div></div>'
    :'<div class="ibox ibox-warn"><strong>No PIN assigned</strong>Staff cannot access the login until a PIN is issued.</div>'+
      '<button class="btn btn-primary" id="btn-piss">\uD83D\uDCCC Issue PIN</button>';

  closeModal();
  var ov=document.createElement('div');
  ov.className='overlay'; ov.id='_modal';
  ov.innerHTML='<div class="modal">'+
    '<div class="mhdr"><div><div class="mtitle">'+s.name+'</div><div class="msub">ID: '+s.id+'</div></div>'+
    '<button class="mclose" id="mc">\u2715</button></div>'+
    '<div class="mbody">'+
    '<div class="sechd">Basic Info</div>'+
    '<div class="fg"><label>Full Name</label><input id="ef-name" value="'+s.name.replace(/"/g,'&quot;')+'"></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
    '<div class="fg"><label>Worker ID</label><input id="ef-id" value="'+s.id+'"></div>'+
    '<div class="fg"><label>Cost Centre</label><input id="ef-cc" list="ef-cc-l" value="'+s.costCentre.replace(/"/g,'&quot;')+'">'+
    '<datalist id="ef-cc-l">'+ccList+'</datalist></div></div>'+
    '<div class="divider"></div>'+
    '<div class="sechd">PIN Management</div>'+pinSec+

    '<div class="sechd">Competency Status</div>'+
    '<p style="font-size:12px;color:var(--muted);margin-bottom:13px">Update components below. Overall status recalculates on save.</p>'+
    compSecs+
    '</div>'+
    '<div class="mfoot"><div class="mfoot-l"><button class="btn btn-danger btn-sm" id="btn-del">\uD83D\uDDD1 Remove Staff</button></div>'+
    '<button class="btn btn-outline" id="m-cancel">Cancel</button>'+
    '<button class="btn btn-primary" id="m-save">\uD83D\uDCBE Save Changes</button></div>'+
    '</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)closeModal();});
  el('mc').addEventListener('click',closeModal);
  el('m-cancel').addEventListener('click',closeModal);
  el('m-save').addEventListener('click',saveStaff);
  el('btn-del').addEventListener('click',function(){deleteStaff(s.id);});
  if(el('btn-piss')) el('btn-piss').addEventListener('click',pinIssue);
  if(el('btn-pregen')) el('btn-pregen').addEventListener('click',pinRegen);
  if(el('btn-prev')) el('btn-prev').addEventListener('click',pinRevoke);

  // Attach change handlers to selects and date inputs
  document.querySelectorAll('#_modal .esel').forEach(function(sel){
    sel.addEventListener('change',function(){ onESel(this); });
  });
  document.querySelectorAll('#_modal .edate').forEach(function(inp){
    inp.addEventListener('change',function(){ onEDate(this); });
  });
}

function onESel(sel){
  var catId=sel.dataset.cat, compId=sel.dataset.comp, v=sel.value;
  var k=catId+'__'+compId, dIn=el('ed-'+k);
  if(!EBUF.comps[catId]) EBUF.comps[catId]={};
  if(v==='done'){
    if(dIn) dIn.style.display='';
    EBUF.comps[catId][compId]=toComp(dIn?dIn.value:'');
  } else {
    if(dIn) dIn.style.display='none';
    EBUF.comps[catId][compId]=v==='ip'?'In Progress':v==='nc'?'Not Completed':'No record';
  }
  refreshOvBadges();
}
function onEDate(inp){
  var catId=inp.dataset.cat, compId=inp.dataset.comp;
  if(!EBUF.comps[catId]) EBUF.comps[catId]={};
  EBUF.comps[catId][compId]=toComp(inp.value);
}
function refreshOvBadges(){
  APP.data.comps.forEach(function(cat){
    var e=el('ov-'+cat.id); if(!e) return;
    e.innerHTML=overallBadge(compIsDone(EBUF,cat.id));
  });
}

function saveStaff(){
  var origId=EBUF.id;
  var name=(el('ef-name')||{}).value, cc=(el('ef-cc')||{}).value, newId=(el('ef-id')||{}).value;
  name=(name||'').trim(); cc=(cc||'').trim(); newId=(newId||'').trim()||origId;
  if(!name||!cc){ toast('Name and cost centre are required.'); return; }
  if(newId!==origId&&APP.data.staff.find(function(s){return s.id===newId;})){
    toast('That Worker ID already exists.'); return;
  }
  EBUF.name=name; EBUF.costCentre=cc; EBUF.id=newId;
  var i=APP.data.staff.findIndex(function(s){return s.id===origId;});
  if(i>=0) APP.data.staff[i]=JSON.parse(JSON.stringify(EBUF));
  persist(); closeModal(); toast('Changes saved for '+name.split(' ')[0]);
  if(ATAB==='staff') renderStaff(); else if(ATAB==='overview') renderOverview();
}

function deleteStaff(id){
  var s=APP.data.staff.find(function(x){return x.id===id;}); if(!s) return;
  dlgConfirm('Permanently remove '+s.name+'? This cannot be undone.').then(function(yes){
    if(!yes) return;
    APP.data.staff=APP.data.staff.filter(function(x){return x.id!==id;});
    persist(); closeModal(); toast(s.name.split(' ')[0]+' removed'); renderStaff();
  });
}

function pinIssue(){
  EBUF.pin=genPin();
  var i=APP.data.staff.findIndex(function(s){return s.id===EBUF.id;});
  if(i>=0) APP.data.staff[i].pin=EBUF.pin;
  persist(); renderStaffModal(); toast('PIN '+EBUF.pin+' issued');
  if(ATAB==='staff') renderStaff();
}
function pinRegen(){
  EBUF.pin=genPin();
  var i=APP.data.staff.findIndex(function(s){return s.id===EBUF.id;});
  if(i>=0) APP.data.staff[i].pin=EBUF.pin;
  persist(); renderStaffModal(); toast('New PIN: '+EBUF.pin);
  if(ATAB==='staff') renderStaff();
}
function pinRevoke(){
  dlgConfirm('Revoke '+EBUF.name.split(' ')[0]+'\'s PIN? They will lose access.').then(function(yes){
    if(!yes) return;
    EBUF.pin=null;
    var i=APP.data.staff.findIndex(function(s){return s.id===EBUF.id;});
    if(i>=0) APP.data.staff[i].pin=null;
    persist(); renderStaffModal(); toast('PIN revoked');
    if(ATAB==='staff') renderStaff();
  });
}

// ═══════════════════════════════════════════════════════════════
//  ADD STAFF MODAL
// ═══════════════════════════════════════════════════════════════
function openAddStaff(){
  var centres=[...new Set(APP.data.staff.map(function(s){return s.costCentre;}))].sort();
  var ccList=centres.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
  closeModal();
  var ov=document.createElement('div');
  ov.className='overlay'; ov.id='_modal';
  ov.innerHTML='<div class="modal sm">'+
    '<div class="mhdr"><div class="mtitle">Add Staff Member</div><button class="mclose" id="mc2">\u2715</button></div>'+
    '<div class="mbody">'+
    '<div class="fg"><label>Full Name *</label><input id="ns-name" placeholder="e.g. Jane Smith"></div>'+
    '<div class="fg"><label>Cost Centre *</label><input id="ns-cc" list="ns-cc-l" placeholder="e.g. HITH">'+
    '<datalist id="ns-cc-l">'+ccList+'</datalist></div>'+
    '<div class="fg"><label>Worker ID (leave blank to auto-generate)</label><input id="ns-id" placeholder="optional"></div>'+
    '<div class="ibox ibox-info"><strong>Next step</strong>After adding, click the staff row to issue a PIN.</div>'+
    '</div>'+
    '<div class="mfoot"><button class="btn btn-outline" id="ns-cancel">Cancel</button>'+
    '<button class="btn btn-primary" id="ns-ok">Add Staff Member</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov)closeModal();});
  el('mc2').addEventListener('click',closeModal);
  el('ns-cancel').addEventListener('click',closeModal);
  el('ns-ok').addEventListener('click',doAddStaff);
  setTimeout(function(){var e=el('ns-name');if(e)e.focus();},50);
}
function doAddStaff(){
  var name=(el('ns-name').value||'').trim();
  var cc=(el('ns-cc').value||'').trim();
  var id=(el('ns-id').value||'').trim()||'s_'+Date.now();
  if(!name||!cc){ toast('Name and cost centre are required.'); return; }
  if(APP.data.staff.find(function(s){return s.id===id;})){ toast('That Worker ID already exists.'); return; }
  var comps={};
  APP.data.comps.forEach(function(cat){
    comps[cat.id]={};
    cat.components.forEach(function(comp){ comps[cat.id][comp.id]='No record'; });
  });
  APP.data.staff.push({id:id,name:name,costCentre:cc,pin:null,comps:comps});
  persist(); closeModal(); toast(name.split(' ')[0]+' added'); renderStaff();
}

// ═══════════════════════════════════════════════════════════════
//  COMPETENCIES TAB
// ═══════════════════════════════════════════════════════════════
function renderComps(){
  var D=APP.data;
  var cats=D.comps.map(function(cat,ci){
    var compRows=cat.components.map(function(comp,cpi){
      return '<div class="comp-row">'+
        '<span class="comp-row-name">'+comp.name+'</span>'+
        '<div class="comp-row-acts">'+
        '<button class="btn btn-outline btn-xs" data-ci="'+ci+'" data-cpi="'+cpi+'" data-act="rename-comp">\u270e Rename</button>'+
        '<button class="btn btn-danger btn-xs" data-ci="'+ci+'" data-cpi="'+cpi+'" data-act="remove-comp">\u2715 Remove</button>'+
        '</div></div>';
    }).join('');
    return '<div class="comp-cat">'+
      '<div class="comp-cat-hdr">'+
      '<div><span class="comp-cat-name">'+cat.name+'</span>'+
      '<span class="badge b-nr" style="margin-left:8px">'+cat.components.length+' component'+(cat.components.length!==1?'s':'')+'</span></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      '<button class="btn btn-outline btn-sm" data-ci="'+ci+'" data-act="rename-cat">\u270e Rename</button>'+
      '<button class="btn btn-primary btn-sm" data-ci="'+ci+'" data-act="add-comp">+ Add Component</button>'+
      '<button class="btn btn-danger btn-sm" data-ci="'+ci+'" data-act="remove-cat">\uD83D\uDDD1 Remove Category</button>'+
      '</div></div>'+
      '<div class="comp-comps">'+(compRows||'<p style="font-size:12px;color:var(--muted);padding:4px 0">No components yet \u2014 add one above.</p>')+'</div>'+
      '</div>';
  }).join('');

  set('tab-body',
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">'+
    '<div><strong style="font-size:14px">Competency Categories</strong>'+
    '<p style="font-size:12px;color:var(--muted);margin-top:2px">Changes apply to all staff records. Export and re-upload after editing.</p></div>'+
    '<button class="btn btn-primary" id="btn-add-cat">+ Add Category</button></div>'+
    (cats||'<div class="ibox ibox-warn"><strong>No categories defined.</strong>Add a category to get started.</div>')
  );

  el('btn-add-cat').addEventListener('click', addCat);
  document.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var act=this.dataset.act, ci=parseInt(this.dataset.ci||0), cpi=parseInt(this.dataset.cpi||0);
      if(act==='rename-cat') editCatName(ci);
      else if(act==='remove-cat') removeCat(ci);
      else if(act==='add-comp') addComp(ci);
      else if(act==='rename-comp') editCompName(ci,cpi);
      else if(act==='remove-comp') removeComp(ci,cpi);
    });
  });
}

function addCat(){
  dlgPrompt('New competency category name:','').then(function(name){
    if(!name||!name.trim()) return;
    var n=name.trim(), ids=APP.data.comps.map(function(c){return c.id;}), id=uniqueSlug(n,ids);
    APP.data.comps.push({id:id,name:n,components:[]});
    APP.data.staff.forEach(function(s){if(!s.comps)s.comps={};s.comps[id]={};});
    persist(); toast('"'+n+'" added'); renderComps();
  });
}
function editCatName(ci){
  var cat=APP.data.comps[ci]; if(!cat) return;
  dlgPrompt('Rename category:',cat.name).then(function(name){
    if(!name||!name.trim()) return;
    APP.data.comps[ci].name=name.trim(); persist(); renderComps();
  });
}
function removeCat(ci){
  var cat=APP.data.comps[ci]; if(!cat) return;
  dlgConfirm('Remove "'+cat.name+'" and all associated staff data? This cannot be undone.').then(function(yes){
    if(!yes) return;
    APP.data.comps.splice(ci,1);
    APP.data.staff.forEach(function(s){if(s.comps)delete s.comps[cat.id];});
    persist(); toast('"'+cat.name+'" removed'); renderComps();
  });
}
function addComp(ci){
  var cat=APP.data.comps[ci]; if(!cat) return;
  dlgPrompt('New component name for "'+cat.name+'":','').then(function(name){
    if(!name||!name.trim()) return;
    var n=name.trim(), ids=cat.components.map(function(c){return c.id;}), id=uniqueSlug(n,ids);
    APP.data.comps[ci].components.push({id:id,name:n});
    APP.data.staff.forEach(function(s){if(!s.comps)s.comps={};if(!s.comps[cat.id])s.comps[cat.id]={};s.comps[cat.id][id]='No record';});
    persist(); toast('"'+n+'" added'); renderComps();
  });
}
function editCompName(ci,cpi){
  var comp=(APP.data.comps[ci]||{components:[]}).components[cpi]; if(!comp) return;
  dlgPrompt('Rename component:',comp.name).then(function(name){
    if(!name||!name.trim()) return;
    APP.data.comps[ci].components[cpi].name=name.trim(); persist(); renderComps();
  });
}
function removeComp(ci,cpi){
  var cat=APP.data.comps[ci]; if(!cat) return;
  var comp=cat.components[cpi]; if(!comp) return;
  dlgConfirm('Remove "'+comp.name+'" from all staff records?').then(function(yes){
    if(!yes) return;
    APP.data.comps[ci].components.splice(cpi,1);
    APP.data.staff.forEach(function(s){if(s.comps&&s.comps[cat.id])delete s.comps[cat.id][comp.id];});
    persist(); toast('"'+comp.name+'" removed'); renderComps();
  });
}

// ═══════════════════════════════════════════════════════════════
//  SETTINGS TAB
// ═══════════════════════════════════════════════════════════════
function renderSettings(){
  var D=APP.data;
  var lastEx=_lsGet('cct_last_export');
  var exNote=lastEx?'Last exported: '+new Date(parseInt(lastEx)).toLocaleString():'Not yet exported this session';
  set('tab-body',
    '<div class="setting-box">'+
    '<div class="setting-title">\uD83D\uDCE4 Export &amp; Publish to SharePoint / Teams</div>'+
    '<div class="setting-sub">Download an updated copy of this file with all current data baked in. Upload to SharePoint (or Teams tab) to publish your changes. Staff see updated data on their next page load.</div>'+
    '<div class="ibox ibox-info">'+
    '<strong>Workflow</strong>'+
    '1. Make all changes here.<br>'+
    '2. Click <strong>Export Updated File</strong> below.<br>'+
    '3. Upload the .html file to SharePoint, replacing the previous version.<br>'+
    '4. Staff open the page and see your latest data automatically.'+
    '</div>'+
    (!_STORAGE_OK?'<div class="ibox ibox-warn"><strong>Storage restricted</strong>Your browser is blocking local storage in this environment. Changes exist in memory only \u2014 export before closing this tab.</div>':'')+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<button class="btn btn-navy" id="btn-export">\u2b07 Export Updated File</button>'+
    '<span style="font-size:12px;color:var(--muted)">'+exNote+'</span></div>'+
    '</div>'+

    '<div class="setting-box">'+
    '<div class="setting-title">\uD83D\uDD11 Change Admin Password</div>'+
    '<div class="setting-sub">Default password is <code>HITH2026</code> \u2014 change before distributing. Password is hashed before storage.</div>'+
    '<div class="fg"><label>Current Password</label><input type="password" id="pw-cur" placeholder="Current password"></div>'+
    '<div class="fg"><label>New Password (min 8 characters)</label><input type="password" id="pw-new" placeholder="New password"></div>'+
    '<div class="fg"><label>Confirm New Password</label><input type="password" id="pw-con" placeholder="Repeat"></div>'+
    '<p class="errmsg" id="pw-err"></p>'+
    '<button class="btn btn-primary" id="btn-pw">Update Password</button>'+
    '</div>'+

    '<div class="setting-box">'+
    '<div class="setting-title">\u2139 App Info</div>'+
    '<p style="font-size:12px;color:var(--muted);line-height:1.7">'+
    'Staff records: <strong>'+D.staff.length+'</strong> &middot; '+
    'Competency categories: <strong>'+D.comps.length+'</strong> &middot; '+
    'PINs issued: <strong>'+D.staff.filter(function(s){return s.pin;}).length+'</strong><br>'+
    'Teams-compatible: pure JS SHA-256, no Web Crypto API required.<br>'+
    'Storage: '+ (_STORAGE_OK?'localStorage available':'in-memory only (storage restricted)') +
    '</p></div>'
  );
  el('btn-export').addEventListener('click',doExport);
  el('btn-pw').addEventListener('click',doChangePw);
}

function doExport(){
  var D=APP.data;
  var exportData={staff:D.staff,comps:D.comps,adminHash:D.adminHash,version:Date.now()};
  var newJson=JSON.stringify(exportData);
  // Use document.documentElement.outerHTML — no network fetch needed, works in Teams iframes
  var src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  src=src.replace(
    /(<script[^>]*id="data-seed"[^>]*>)[\s\S]*?(<\/script>)/,
    function(m,p1,p2){ return p1+'\n'+newJson+'\n'+p2; }
  );
  _lsSet('cct_last_export',Date.now().toString());
  var blob=new Blob([src],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='competency-tracker-'+new Date().toISOString().slice(0,10)+'.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Downloaded! Upload to SharePoint to publish changes.',4000);
  renderSettings();
}

async function doChangePw(){
  var cur=(el('pw-cur').value||''), nw=(el('pw-new').value||''), cn=(el('pw-con').value||'');
  var err=el('pw-err'); err.style.display='none';
  if(nw!==cn||nw.length<8){ err.textContent='Passwords must match and be at least 8 characters.'; err.style.display='block'; return; }
  var curHash=await sha256(cur);
  if(curHash!==APP.data.adminHash){ err.textContent='Incorrect current password.'; err.style.display='block'; return; }
  APP.data.adminHash=await sha256(nw);
  persist(); el('pw-cur').value=el('pw-new').value=el('pw-con').value='';
  toast('Password updated. Export the file to make this permanent.');
}

function showUser(){
  var sid=APP.session&&APP.session.staffId;
  var s=APP.data.staff.find(function(x){return x.id===sid;});
  if(!s){ showUserLogin(); return; }
  var D=APP.data;
  var chips=D.comps.map(function(cat){
    var done=compIsDone(s,cat.id),lbl=cat.name.split('\u2014')[0].trim();
    return '<span class="badge '+(done?'b-ok':'b-nc')+'">'+(done?'\u2713 ':'')+lbl+'</span>';
  }).join('');
  var cards=D.comps.map(function(cat){
    var done=compIsDone(s,cat.id);
    var rows=cat.components.map(function(comp){
      var val=((s.comps[cat.id]||{})[comp.id])||'No record';
      return '<div class="urow"><span class="urow-lbl">'+comp.name+'</span>'+statusBadge(val)+'</div>';
    }).join('');
    return '<div class="ucard"><div class="uchead"><span class="uctitle">'+cat.name+'</span>'+overallBadge(done)+'</div>'+rows+'</div>';
  }).join('');
  el('app').innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column">'+HDR_HTML+
    '<div style="flex:1;overflow-y:auto"><div class="uview">'+
    '<div class="uhdr"><div class="uname">'+s.name+'</div>'+
    '<div class="umeta">'+s.costCentre+' &middot; ID: '+s.id+'</div>'+
    '<div class="u-chips">'+chips+'</div></div>'+
    cards+
    '<p style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;margin-bottom:24px">'+
    'Data sourced from SVHM learning systems &middot; Extracted Aug 2026<br>'+
    'Contact your Clinical Educator for any discrepancies.</p>'+
    '</div></div></div>';
  set('hdr-right','<button class="btn btn-ghost btn-sm" id="hdr-so">Sign Out</button>');
  el('hdr-so').addEventListener('click', signOut);
}

// ═══════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════
function boot(){
  APP.data=loadData();
  // Also try restoring session from sessionStorage on hard reload
  if(!_SESSION){ try{ var raw=sessionStorage.getItem('cct_ses'); if(raw) _SESSION=JSON.parse(raw); }catch(e){} }
  APP.session=getSession();
  if(APP.session){
    if(APP.session.role==='admin') showAdmin();
    else showUser();
  } else { showLanding(); }
}
window.addEventListener('DOMContentLoaded', boot);
