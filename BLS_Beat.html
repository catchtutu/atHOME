<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS Metronome</title>
<style>
  :root {
    --navy: #0D2D5E;
    --blue: #1A6FAF;
    --blue-lt: #E5F0FA;
    --bg: #EEF2F7;
    --surface: #FFFFFF;
    --red: #C91B1B;
    --red-bg: #FEF2F2;
    --muted: #6B7280;
    --border: #DDE3EC;
    --r: 13px;
    --r-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--navy);
    padding: 16px 20px 14px;
    text-align: center;
    position: sticky; top: 0; z-index: 10;
  }
  header .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 3px;
  }
  header h1 { font-size: 19px; font-weight: 800; color: #fff; line-height: 1.2; }
  header .sub { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 3px; }

  main {
    flex: 1; display: flex; align-items: center;
    justify-content: center; padding: 24px 16px 40px;
  }
  .card {
    background: var(--surface); border-radius: var(--r);
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 28px 24px 32px; width: 100%; max-width: 360px;
    display: flex; flex-direction: column; align-items: center; gap: 28px;
  }

  /* bpm buttons */
  .bpm-group { display: flex; gap: 12px; width: 100%; }
  .bpm-btn {
    flex: 1; padding: 14px 0; border-radius: var(--r-sm);
    border: 2px solid var(--border); background: var(--bg);
    color: var(--muted); font-family: inherit; font-size: 22px;
    font-weight: 800; cursor: pointer; transition: all .18s;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .bpm-btn span { font-size: 11px; font-weight: 600; letter-spacing: .04em; opacity: .7; }
  .bpm-btn.active { border-color: var(--blue); background: var(--blue-lt); color: var(--navy); }
  .bpm-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* Beat display */
  .beat-display {
    position: relative; width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
  }
  .ripple {
    position: absolute; border-radius: 50%;
    border: 3px solid rgba(26,111,175,0.6);
    width: 140px; height: 140px;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(1);
    pointer-events: none;
    animation: rippleOut 0.65s ease-out forwards;
  }
  @keyframes rippleOut {
    0%   { transform: translate(-50%,-50%) scale(1);    opacity: 0.75; }
    100% { transform: translate(-50%,-50%) scale(1.9);  opacity: 0; }
  }
  .beat-ring {
    position: relative; z-index: 2;
    width: 140px; height: 140px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: background .06s, border-color .06s;
  }
  .beat-ring.lit { background: var(--blue-lt); border-color: var(--blue); }
  .beat-num {
    font-size: 58px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--navy); line-height: 1; user-select: none;
  }
  .beat-num.idle { font-size: 40px; color: var(--muted); }

  /* Rate label */
  .rate-label { font-size: 13px; color: var(--muted); font-style: italic; }

  /* Cycle-end toggle */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 12px 14px; border-radius: var(--r-sm);
    background: var(--bg); border: 1.5px solid var(--border);
  }
  .toggle-label { font-size: 13px; font-weight: 600; color: #1B2333; }
  .toggle-label small {
    display: block; font-size: 11px; font-weight: 400;
    color: var(--muted); margin-top: 2px;
  }
  .toggle-switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0; border-radius: 12px;
    background: var(--border); cursor: pointer; transition: background .2s;
  }
  .toggle-track::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .toggle-switch input:checked + .toggle-track { background: var(--blue); }
  .toggle-switch input:checked + .toggle-track::after { transform: translateX(18px); }

  /* Start/Stop */
  .start-btn {
    width: 100%; padding: 17px 0; border-radius: var(--r-sm);
    border: none; font-family: inherit; font-size: 15px;
    font-weight: 700; cursor: pointer;
    transition: background .18s, transform .1s; letter-spacing: .02em;
  }
  .start-btn.start { background: var(--navy); color: #fff; }
  .start-btn.stop  { background: var(--red-bg); color: var(--red); border: 2px solid #FEB4B4; }
  .start-btn:active { transform: scale(.98); }
  .start-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  main, footer { position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="ecg-bg"></div>

<header>
  <div class="eyebrow">BLS Training</div>
  <h1>CPR Metronome</h1>
  <div class="sub">compression rate guide</div>
</header>

<main>
  <div class="card">

    <div class="bpm-group">
      <button class="bpm-btn active" id="btn100" onclick="setBpm(100)">100<span>bpm</span></button>
      <button class="bpm-btn"        id="btn120" onclick="setBpm(120)">120<span>bpm</span></button>
    </div>

    <div class="beat-display" id="beatDisplay">
      <div class="beat-ring" id="ring">
        <span class="beat-num idle" id="beatNum">–</span>
      </div>
    </div>

    <div class="rate-label" id="rateLabel">100 bpm · Press Start</div>

    <!-- Cycle-end accent toggle -->
    <label class="toggle-row">
      <div class="toggle-label">
        cycle-end accent
        <small>higher-pitched beep on beat 30</small>
      </div>
      <div class="toggle-switch">
        <input type="checkbox" id="accentToggle" onchange="accentEnabled = this.checked">
        <div class="toggle-track"></div>
      </div>
    </label>

    <button class="start-btn start" id="startBtn" onclick="toggleMetronome()">▶ Start</button>

  </div>
</main>

<footer style="text-align:center; padding: 0 0 18px; font-size: 12px; color: var(--muted); font-style: normal; letter-spacing: .01em;">
  &copy; Ben Stone 2026
</footer>

<script>
  let bpm = 100, running = false, beatNum = 0;
  let intervalId = null, audioCtx = null, litTimeout = null;
  let accentEnabled = false;

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playClick(highPitch = false) {
    const ctx  = getCtx();
    const t    = ctx.currentTime;
    const freq = highPitch ? 1480 : 880;

    // Tone layer
    const osc  = ctx.createOscillator();
    const gOsc = ctx.createGain();
    osc.connect(gOsc); gOsc.connect(ctx.destination);
    osc.frequency.setValueAtTime(freq, t);
    osc.type = 'square';
    gOsc.gain.setValueAtTime(0, t);
    gOsc.gain.linearRampToValueAtTime(highPitch ? 1.0 : 0.9, t + 0.003);
    gOsc.gain.exponentialRampToValueAtTime(0.001, highPitch ? t + 0.1 : t + 0.055);
    osc.start(t); osc.stop(t + (highPitch ? 0.11 : 0.06));

    // Noise transient
    const bufLen = ctx.sampleRate * 0.025;
    const buf    = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data   = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);
    const noise  = ctx.createBufferSource();
    const gNoise = ctx.createGain();
    const hpf    = ctx.createBiquadFilter();
    noise.buffer = buf;
    noise.connect(hpf); hpf.connect(gNoise); gNoise.connect(ctx.destination);
    hpf.type = 'highpass'; hpf.frequency.value = 1200;
    gNoise.gain.setValueAtTime(0.55, t);
    gNoise.gain.exponentialRampToValueAtTime(0.001, t + 0.025);
    noise.start(t); noise.stop(t + 0.03);
  }

  function spawnRipple() {
    const r = document.createElement('div');
    r.className = 'ripple';
    document.getElementById('beatDisplay').appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  function doBeat() {
    beatNum = (beatNum % 30) + 1;

    const el = document.getElementById('beatNum');
    el.textContent = beatNum;
    el.className = 'beat-num';

    const ring = document.getElementById('ring');
    ring.classList.add('lit');
    clearTimeout(litTimeout);
    litTimeout = setTimeout(() => ring.classList.remove('lit'), 100);

    spawnRipple();
    setTimeout(spawnRipple, 75);

    playClick(accentEnabled && beatNum === 30);
  }

  function setBpm(val) {
    bpm = val;
    document.getElementById('btn100').classList.toggle('active', val === 100);
    document.getElementById('btn120').classList.toggle('active', val === 120);
    updateLabel();
    if (running) { clearInterval(intervalId); intervalId = setInterval(doBeat, 60000 / bpm); }
  }

  function updateLabel() {
    document.getElementById('rateLabel').textContent = running
      ? `${bpm} bpm`
      : `${bpm} bpm · Press Start`;
  }

  function toggleMetronome() {
    const btn = document.getElementById('startBtn');
    if (!running) {
      running = true; beatNum = 0;
      doBeat();
      intervalId = setInterval(doBeat, 60000 / bpm);
      btn.textContent = '■ Stop'; btn.className = 'start-btn stop';
      updateLabel();
    } else {
      running = false;
      clearInterval(intervalId); intervalId = null;
      const el = document.getElementById('beatNum');
      el.textContent = '–'; el.className = 'beat-num idle';
      document.getElementById('ring').classList.remove('lit');
      btn.textContent = '▶ Start'; btn.className = 'start-btn start';
      document.getElementById('rateLabel').textContent = `${bpm} bpm · Press Start`;
    }
  }
</script>
</body>
</html>
